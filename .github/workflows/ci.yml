name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: notifier
          POSTGRES_PASSWORD: notifier
          POSTGRES_DB: notifier
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U notifier -d notifier"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://notifier:notifier@localhost:5432/notifier?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      - name: Test (unit + integration + e2e)
        run: go test -race -count=1 -coverpkg=./internal/...,./migrations/... -coverprofile=coverage.out ./...
      - name: Coverage
        run: go tool cover -func=coverage.out | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up --build -d --wait
      - name: Smoke test
        run: ./scripts/smoke.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color api worker migrate
      - name: Stop
        if: always()
        run: docker compose down -v
